<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows raster calculator</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#eef1f5;color:#182333}header{height:64px;display:flex;gap:14px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #c9d0db}h1{font-size:17px;margin:0 auto 0 0}button,select{font:inherit;padding:7px 12px}#status{min-width:180px}#screen{height:calc(100dvh - 64px);position:relative;overflow:hidden}details{position:fixed;bottom:0;right:0;background:white;z-index:10;max-width:50vw}pre{max-height:220px;overflow:auto;font-size:11px}noscript{display:block;padding:25px}
</style>
</head>
<body>
<header><h1>Windows raster calculator</h1><select id="application" aria-label="Application"><option value="calculator">Calculator</option><option value="windows">Window behavior</option></select><button id="start" disabled>Start</button><button id="stop" disabled>Stop</button><span id="status" role="status">Loading display</span></header>
<div id="screen" aria-label="Guest windows"></div>
<details><summary>Details</summary><pre id="log"></pre></details>
<noscript>Enable JavaScript to run the calculator.</noscript>
<script src="wire.js"></script>
<script src="qtloader.js"></script>
<script src="raster_display.js"></script>
<script src="app.js"></script>
</body>
</html>
